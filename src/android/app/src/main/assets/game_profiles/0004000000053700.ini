# E.X. Troopers - Thor compatibility profile.
# Seeded into GameSettings/ on first run and editable in-app via the game's Game Settings button.
# Only keys listed here override config.ini for this title; everything else stays global.

[Core]
use_cpu_jit = true

[Renderer]
# The Thor panel is 1920x1080 and draws the 3DS top screen at 1800x1080, so native 1:1 is
# 4.5x. This title's snow field is 1800 alpha blended draws a frame at about 58x overdraw, so
# at 3x it read 63.79% until the draw rules below were found. With them it holds full speed at
# 3x: 99.66% mean and 99.32% minimum over eight samples, 59.23 FPS at 10.79 ms against a
# 16.67 ms budget, GPU at 680 MHz, measured in the snow field from save state 5.
# The rules live in ShaderRules/0004000000053700.txt and are seeded from the APK. Delete that
# file to get the original picture back, at about 64% speed at 3x, or drop to 2x where the
# untouched picture holds 99.97%.
resolution_factor = 3
screen_filter = 2
use_hw_shader = true
use_shader_jit = true
use_disk_shader_cache = true
shaders_accurate_mul = false
use_frame_limit = true
frame_limit = 100

[Utility]
# The combiner quantises every stage to eight bits, the way the PICA wrote each stage into
# an eight bit register. It costs a multiply, a round and a multiply per stage on colour and
# on alpha, which is a large share of the short shaders that cover most of this scene.
# Measured in the snow field at 2x with the frame limit at 200: 114.99% with it on, 120.52%
# with it off, and the screenshots are identical.
accurate_tev_rounding = false
custom_textures = false
preload_textures = false
async_custom_loading = true

[Compatibility]
skip_texture_copy_fallback = true
